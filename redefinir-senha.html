
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Multiverso Nerd</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  color: #f5f3ff;
  background:
    radial-gradient(circle at top, #30205c, transparent 45%),
    linear-gradient(145deg, #090817, #15102b 60%, #080713);
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 34px 26px;
  border: 1px solid #51417d;
  border-radius: 22px;
  background: #191430;
  box-shadow: 0 20px 60px #0008;
}

.logo {
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  border-radius: 18px;
  font-size: 28px;
  background: linear-gradient(135deg, #7655e8, #287bdc);
}

h1 { margin: 0; text-align: center; font-size: 25px; }

.subtitle {
  margin: 10px 0 25px;
  color: #aaa4c5;
  text-align: center;
  line-height: 1.5;
}

label {
  display: block;
  margin: 16px 0 7px;
  color: #d9d4ef;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #51476f;
  border-radius: 11px;
  outline: none;
  color: white;
  background: #100d20;
  font-size: 15px;
}

input:focus { border-color: #9275ff; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: 0;
  border-radius: 11px;
  color: white;
  background: linear-gradient(100deg, #7655e8, #3478df);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  min-height: 20px;
  margin-top: 18px;
  color: #f4c77b;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

a {
  display: block;
  margin-top: 20px;
  color: #b9a8ff;
  text-align: center;
  font-size: 13px;
  text-decoration: none;
}
</style>
</head>

<body>

<main class="card">
  <div class="logo">✦</div>

  <h1>Nova senha</h1>
  <p class="subtitle">Escolha uma nova senha para sua conta do Multiverso Nerd.</p>

  <form id="resetForm">
    <label for="password">Nova senha</label>
    <input
      id="password"
      type="password"
      placeholder="Mínimo de 6 caracteres"
      minlength="6"
      required
    >

    <label for="confirmPassword">Confirme a nova senha</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Digite novamente"
      minlength="6"
      required
    >

    <button type="submit">SALVAR NOVA SENHA</button>
  </form>

  <p class="message" id="message"></p>

  <a href="login.html">Voltar para o login</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>
const supabaseClient = window.mnSupabaseClient;
const message = document.getElementById("message");

let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    message.textContent = "Link validado. Você já pode cadastrar sua nova senha.";
  }
});

supabaseClient.auth.getSession().then(({ data, error }) => {
  if (error || !data.session) {
    message.textContent = "Abra esta página pelo link de recuperação enviado ao seu e-mail.";
  }
});

document.getElementById("resetForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password.length < 6) {
    message.textContent = "A senha precisa ter pelo menos 6 caracteres.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent = "As senhas não são iguais.";
    return;
  }

  message.textContent = "Salvando nova senha...";

  const { error } = await supabaseClient.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent = "Não foi possível alterar a senha: " + error.message;
    return;
  }

  message.textContent = "Senha alterada com sucesso! Voltando ao login...";

  await supabaseClient.auth.signOut();

  setTimeout(() => {
    window.location.replace("login.html");
  }, 1800);
});
</script>

</body>
</html>
