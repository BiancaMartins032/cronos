<body>

<script>
  
const parametros = new URLSearchParams(window.location.search);
const jogoId = parametros.get("id");

const jogos = JSON.parse(localStorage.getItem("mn_jogos") || "[]");
const jogo = jogos.find(item => String(item.id) === String(jogoId));
const lista = document.getElementById("listaConquistas");

let filtroAtual = "todas";
let filtroSituacao = "todas";
let conquistas = [];

  async function carregarEstatisticas(titleId) {
  const area = document.getElementById("listaEstatisticasJogo");

  area.textContent = "Carregando estatísticas...";

  try {
    const resposta = await fetch(
      "/api/xbox/stats?titleId=" + encodeURIComponent(titleId)
    );

    if (!resposta.ok) {
      throw new Error("Não foi possível consultar as estatísticas.");
    }

    const dados = await resposta.json();
    const conteudo = dados.content || dados;

    const estatisticasGerais =
      (conteudo.statlistscollection || [])
        .flatMap(item => item.stats || []);

    const estatisticasGrupos =
      (conteudo.groups || [])
        .flatMap(grupo =>
          (grupo.statlistscollection || [])
            .flatMap(item => item.stats || [])
        );

    const estatisticas = [
      ...estatisticasGerais,
      ...estatisticasGrupos
    ];

    if (!estatisticas.length) {
      area.textContent = "Nenhuma estatística disponível.";
      return;
    }

    area.innerHTML = "";

    function adicionarEstatistica(nome, valor) {
      const linha = document.createElement("div");
      linha.className = "item-estatistica";

      const titulo = document.createElement("span");
      titulo.textContent = nome;

      const resultado = document.createElement("strong");
      resultado.textContent = valor;

      linha.append(titulo, resultado);
      area.appendChild(linha);
    }

    const tempo = estatisticas.find(
      item => item.name === "MinutesPlayed"
    );

    if (tempo) {
      const minutos = Number(tempo.value);

      if (Number.isFinite(minutos)) {
        const horas = Math.floor(minutos / 60);
        const minutosRestantes = minutos % 60;

        adicionarEstatistica(
          "Tempo de jogo",
          `${horas}h ${minutosRestantes}min`
        );
      }
    }

    estatisticas
      .filter(item => item.name !== "MinutesPlayed")
      .forEach(item => {
        const nome =
          item.groupproperties?.DisplayName ||
          item.properties?.DisplayName ||
          item.name;

        const numero = Number(item.value);

        if (!Number.isFinite(numero)) return;

        const formato =
          item.groupproperties?.DisplayFormat;

        const valor = numero.toLocaleString("pt-BR", {
  maximumFractionDigits: 2
});

        adicionarEstatistica(nome, valor);
      });

    const observacao = document.createElement("p");
    observacao.className = "aviso-estatisticas";
    observacao.textContent =
      "A estatística de Mais Procurados retornou um valor cuja interpretação ainda precisa ser confirmada. A Xbox não forneceu, nesta consulta, dados separados sobre troféus do Charada ou distância percorrida.";

    area.appendChild(observacao);

  } catch (erro) {
    console.error("Erro ao carregar estatísticas:", erro);
    area.textContent = "Não foi possível carregar as estatísticas do jogo.";
  }
}
function atualizarConquistaMitica() {
  const originais = conquistas.filter(
    c => c.category === "original"
  );

  const concluidas = originais.filter(
    c => c.unlocked
  ).length;

  const total = 69;
  const porcentagem = Math.round(
    (concluidas / total) * 100
  );

  let secao = document.getElementById("conquistaMitica");

  if (!secao) {
    secao = document.createElement("section");
    secao.id = "conquistaMitica";
    secao.className = "conquista";
    secao.style.marginBottom = "24px";

    const tituloSecao = document.querySelector(".titulo-secao");

    if (tituloSecao) {
      tituloSecao.parentNode.insertBefore(
        secao,
        tituloSecao
      );
    }
  }

  secao.innerHTML = "";

  const detalhes = document.createElement("div");
  detalhes.className = "detalhes";

  const nome = document.createElement("strong");
  nome.textContent = "Conquista Mítica";
  const descricao = document.createElement("p");
  descricao.textContent =
    "Conclua todas as 69 conquistas originais de Batman: Arkham Knight.";

  const progressoTexto = document.createElement("p");
  progressoTexto.textContent =
    `${concluidas}/${total} conquistas originais · ${porcentagem}%`;

  const progresso = document.createElement("div");
  progresso.className = "progresso-conquista";

  const barra = document.createElement("div");
  barra.className = "barra-conquista";
  barra.style.width = porcentagem + "%";

  progresso.appendChild(barra);

  const status = document.createElement("span");
  status.className = "status " +
    (concluidas === total ? "concluida" : "pendente");

  status.textContent = concluidas === total
    ? "Conquista Mítica desbloqueada!"
    : "Ainda bloqueada";

  detalhes.append(
    nome,
    descricao,
    progressoTexto,
    progresso,
    status
  );

  secao.appendChild(detalhes);

  const estatisticas = document.querySelector(".secao-estatisticas");

  if (estatisticas) {
    secao.insertAdjacentElement("afterend", estatisticas);
  }
}


// DLCs identificadas no Xbox.
const nomesComplementos = [

  "Contra o Capuz Vermelho"
];

function normalizarNome(nome) {
  return String(nome || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}


function classificarConquista(id) {
  const numero = Number(id);

  if (
    numero >= 1 &&
    numero <= 71 &&
    numero !== 10 &&
    numero !== 13
  ) {
    return "original";
  }

  if (
    numero >= 72 &&
    numero <= 117 &&
    numero !== 83 &&
    numero !== 84
  ) {
    return "complemento";
  }

  return "nao-identificada";
}


function mostrarMensagem(texto) {
  lista.innerHTML = "";

  const mensagem = document.createElement("div");
  mensagem.className = "mensagem";
  mensagem.textContent = texto;

  lista.appendChild(mensagem);
}

function formatarData(data) {
  if (!data || data.startsWith("0001-")) return "";

  const dataValida = new Date(data);

  if (Number.isNaN(dataValida.getTime())) return "";

  return dataValida.toLocaleDateString("pt-BR", {
    timeZone: "UTC"
  });
}

async function carregarJogo() {
  if (!jogo) {
    document.getElementById("tituloJogo").textContent =
      "Jogo não encontrado";

    mostrarMensagem(
      "Não foi possível localizar este jogo na sua coleção."
    );
    return;
  }

  document.getElementById("tituloJogo").textContent = jogo.title;
  document.getElementById("capaJogo").src = jogo.cover || "";

  mostrarMensagem("Conectando ao Xbox e carregando conquistas...");

  const chaveCache = "mn_conquistas_" + jogo.id;

  try {
    const respostaJogos = await fetch("/api/xbox/games");

    if (!respostaJogos.ok) {
      throw new Error("Não foi possível consultar o histórico Xbox.");
    }

    const dadosJogos = await respostaJogos.json();

    const titulos = dadosJogos.content?.titles ||
      dadosJogos.titles || [];

    if (!titulos.length) {
      throw new Error("O histórico Xbox não retornou jogos.");
    }

    const nomeProcurado = normalizarNome(jogo.title);

    let jogoXbox = titulos.find(titulo =>
      normalizarNome(titulo.name) === nomeProcurado
    );

    if (!jogoXbox) {
      jogoXbox = titulos.find(titulo => {
        const nomeXbox = normalizarNome(titulo.name);

        return nomeXbox.length >= 5 &&
          nomeProcurado.length >= 5 &&
          (
            nomeXbox.includes(nomeProcurado) ||
            nomeProcurado.includes(nomeXbox)
          );
      });
    }

    if (!jogoXbox || !jogoXbox.titleId) {
      throw new Error(
        "Este jogo não foi encontrado no histórico Xbox."
      );
    }
    carregarEstatisticas(jogoXbox.titleId);

    const url =
      "/api/xbox/achievements?xuid=" +
      encodeURIComponent(dadosJogos.content?.xuid || "") +
      "&titleId=" +
      encodeURIComponent(jogoXbox.titleId);

    const respostaConquistas = await fetch(url);

    if (!respostaConquistas.ok) {
      throw new Error("O Xbox não conseguiu fornecer as conquistas.");
    }

    const dadosConquistas = await respostaConquistas.json();

    const listaXbox = dadosConquistas.content?.achievements ||
      dadosConquistas.achievements || [];

    if (!Array.isArray(listaXbox)) {
      throw new Error("O formato das conquistas é inválido.");
    }

    conquistas = listaXbox.map(item => {
      const recompensa = (item.rewards || []).find(
        r => r.type === "Gamerscore"
      );

      const imagem = (item.mediaAssets || []).find(
        asset => asset.type === "Icon"
      );

      return {
        id: item.id,
        name: item.name || "Conquista",
        description:
          item.description ||
          item.lockedDescription ||
          "Descrição não disponível.",
        gamerscore: Number(recompensa?.value || 0),
        icon: imagem?.url || "",
        unlocked:
          String(item.progressState).toLowerCase() === "achieved",
        timeUnlocked: item.progression?.timeUnlocked || null,
        rarity: item.rarity?.currentCategory || "Common",
        rarityPercentage:
          Number(item.rarity?.currentPercentage || 0),
        category: classificarConquista(item.id)
      };
    });

    localStorage.setItem(
      chaveCache,
      JSON.stringify(conquistas)
    );

    atualizarConquistas();

  } catch (error) {
    console.error("Erro na sincronização Xbox:", error);

    const cache = JSON.parse(
      localStorage.getItem(chaveCache) || "[]"
    );

    if (cache.length) {
      conquistas = cache;
      atualizarConquistas();
      console.warn("Exibindo conquistas salvas anteriormente.");
    } else {
      mostrarMensagem(error.message);
    }
  }
}

function atualizarConquistas() {
  const concluidas = conquistas.filter(c => c.unlocked).length;
  const total = conquistas.length;
  const gamerscoreConcluido = conquistas
  .filter(c => c.unlocked)
  .reduce((total, c) => total + c.gamerscore, 0);

const gamerscoreTotal = conquistas
  .reduce((total, c) => total + c.gamerscore, 0);

document.getElementById("gamerscoreJogo").textContent =
  `${gamerscoreConcluido}/${gamerscoreTotal}`;

document.getElementById("contadorConquistasJogo").textContent =
  `${concluidas}/${total}`;

  const porcentagem = gamerscoreTotal > 0
  ? Math.round((gamerscoreConcluido / gamerscoreTotal) * 100)
  : 0;

  document.getElementById("totalConcluidas").textContent =
    concluidas;

  document.getElementById("totalConquistas").textContent =
    total;

  document.getElementById("porcentagem").textContent =
    porcentagem + "%";

  document.getElementById("barraProgresso").style.width =
    porcentagem + "%";

  atualizarConquistaMitica();
renderizarConquistas();
}


function renderizarConquistas() {
  lista.innerHTML = "";

  let filtradas = conquistas;

  if (filtroAtual === "original") {
    filtradas = conquistas.filter(
      c => c.category === "original"
    );
  }

  if (filtroAtual === "complemento") {
    filtradas = conquistas.filter(
      c => c.category === "complemento"
    );
  }
  if (filtroSituacao === "desbloqueadas") {
  filtradas = filtradas.filter(c => c.unlocked);
}

if (filtroSituacao === "bloqueadas") {
  filtradas = filtradas.filter(c => !c.unlocked);
}

  if (!filtradas.length) {
    mostrarMensagem(
      "Não há conquistas identificadas nesta categoria."
    );
    return;
  }

  filtradas.forEach(conquista => {
    const card = document.createElement("article");
    card.className = "conquista";

    // Imagem da conquista
    const icone = document.createElement("div");
    icone.className = "icone-conquista";

    if (conquista.icon) {
      const imagem = document.createElement("img");
      imagem.src = conquista.icon;
      imagem.alt = conquista.name;
      icone.appendChild(imagem);
    }

    const detalhes = document.createElement("div");
    detalhes.className = "detalhes";

    // Nome
    const nome = document.createElement("strong");
    nome.textContent = conquista.name;

    // Pontuação e porcentagem
    const pontos = document.createElement("div");
    pontos.className = "pontuacao-linha";

    const diamante = document.createElement("span");
    diamante.className = "simbolo-diamante";

    diamante.innerHTML = `
      <svg viewBox="0 0 24 24"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8l4-5h10l4 5-9 13L3 8z"/>
        <path d="M3 8h18M7 3l5 18 5-18M7 3l-4 5"/>
      </svg>
    `;

    const simboloG = document.createElement("span");
    simboloG.className = "simbolo-g";
    simboloG.textContent = "G";

    const valorG = document.createElement("span");
    valorG.className = "valor-g";
    valorG.textContent = conquista.gamerscore;

    const porcentagem = document.createElement("span");
    porcentagem.className = "porcentagem-raridade";
    porcentagem.textContent =
      conquista.rarityPercentage.toLocaleString("pt-BR") + "%";

    pontos.append(
      diamante,
      simboloG,
      valorG,
      porcentagem
    );

    // Descrição
    const descricao = document.createElement("p");
    descricao.textContent = conquista.description;

    // Progresso
    const progresso = document.createElement("div");
    progresso.className = "progresso-conquista";

    const barra = document.createElement("div");
    barra.className = "barra-conquista";

    const progressoAtual = conquista.unlocked ? 100 : 0;

    barra.style.width = progressoAtual + "%";

    progresso.appendChild(barra);

    // Status
    const status = document.createElement("span");
    status.className = "status " +
      (conquista.unlocked ? "concluida" : "pendente");

    status.textContent = conquista.unlocked
      ? "Desbloqueada"
      : "Bloqueada";

    // Data
    const data = document.createElement("span");
    data.textContent = conquista.unlocked
      ? "Desbloqueada em " +
        formatarData(conquista.timeUnlocked)
      : "Ainda não desbloqueada";

    // Categoria
    const categoria = document.createElement("span");

    categoria.textContent =
      conquista.category === "original"
        ? "Original"
        : conquista.category === "complemento"
          ? "Complemento"
          : "Categoria não identificada";

    const extras = document.createElement("div");
    extras.className = "informacoes-extras";

    extras.append(status, data, categoria);

    detalhes.append(
      nome,
      pontos,
      descricao,
      progresso,
      extras
    );

    card.append(icone, detalhes);
    lista.appendChild(card);
  });
}
