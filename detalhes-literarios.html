<script>
    
const parametros = new URLSearchParams(window.location.search);
const tipo = parametros.get("tipo");
const nome = parametros.get("nome");

const fotoPerfil = document.getElementById("fotoPerfil");
const nomePerfil = document.getElementById("nomePerfil");
const tipoPerfil = document.getElementById("tipoPerfil");
const biografia = document.getElementById("biografia");
const listaLivros = document.getElementById("listaLivros");

let livroSelecionado = null;

function voltar() {
  if (
    document.referrer &&
    new URL(document.referrer).origin === location.origin
  ) {
    history.back();
  } else {
    location.href = "colecoes.html";
  }
}

function lerLivrosLocais() {
  try {
    return JSON.parse(localStorage.getItem("mn_livros") || "[]");
  } catch {
    return [];
  }
}

function obterFavorito() {
  const chave = tipo === "autor"
    ? "mn_autores_favoritos"
    : "mn_editoras_favoritas";

  try {
    const favoritos = JSON.parse(localStorage.getItem(chave) || "[]");

    return favoritos.find(
      item => item.nome?.toLowerCase() === nome?.toLowerCase()
    );
  } catch {
    return null;
  }
}

  function configurarBotaoFavoritoAutor() {
  const botao = document.getElementById("botaoFavoritarAutor");

  if (!botao) return;

  if (tipo !== "autor") {
    botao.style.display = "none";
    return;
  }

  const atualizar = () => {
    const favorito = obterFavorito();

    botao.textContent = favorito
  ? "Autor favoritado ♥"
  : "Favoritar autor ♡";

    botao.classList.toggle("favorito-ativo", !!favorito);
  };

  botao.onclick = () => {
    let favoritos = [];

    try {
      favoritos = JSON.parse(
        localStorage.getItem("mn_autores_favoritos") || "[]"
      );
    } catch {
      favoritos = [];
    }

    const indice = favoritos.findIndex(
      item => item.nome?.toLowerCase() === nome.toLowerCase()
    );

    if (indice >= 0) {
      favoritos.splice(indice, 1);
    } else {
      favoritos.push({
        nome: nome,
        imagem: fotoPerfil.getAttribute("src") || ""
      });
    }

    localStorage.setItem(
      "mn_autores_favoritos",
      JSON.stringify(favoritos)
    );

    atualizar();
  };

  atualizar();
}
  window.addEventListener("scroll", () => {
  const indicacao = document.getElementById("indicacaoRolagem");

  if (
    indicacao &&
    indicacao.getBoundingClientRect().bottom < 0
  ) {
    indicacao.style.display = "none";
  }
});
function configurarPerfil() {
  if (!nome || !["autor", "editora"].includes(tipo)) {
    nomePerfil.textContent = "Informação indisponível";
    biografia.textContent = "Não foi possível identificar este perfil.";

  if (favorito?.imagem) {
    fotoPerfil.src = favorito.imagem;
  }

  fotoPerfil.onerror = () => {
    fotoPerfil.style.display = "none";
  };

    configurarBotaoFavoritoAutor();
  return true;
}

/* Procura uma edição em português para cada obra */

async function buscarEdicaoPortugues(livro) {
  if (!livro.key) return null;

  try {
    const chaveObra = livro.key.startsWith("/works/")
      ? livro.key
      : "/works/" + livro.key;

    const resposta = await fetch(
      "https://openlibrary.org" + chaveObra + "/editions.json?limit=100"
    );

    if (!resposta.ok) return null;

    const dados = await resposta.json();

    const edicoes = (dados.entries || []).filter(edicao => {
      const idiomas = (edicao.languages || []).map(item =>
        (item.key || "").toLowerCase()
      );

      return idiomas.some(idioma =>
        idioma.endsWith("/por") ||
        idioma.endsWith("/pt") ||
        idioma.endsWith("/pt-br")
      );
    });

    if (!edicoes.length) return null;

    const edicao = edicoes.find(item =>
      item.title && item.covers?.length
    ) || edicoes.find(item => item.title);

    if (!edicao) return null;

    const capa = edicao.covers?.[0] || livro.cover_i;

    if (!capa) return null;

    const anoEdicao = (edicao.publish_date || "").match(/\d{4}/);

    return {
      obraId: chaveObra,
      title: edicao.title,
      author: livro.author_name?.[0] || nome,
      cover_i: capa,
      capa: "https://covers.openlibrary.org/b/id/" + capa + "-M.jpg",
      first_publish_year: anoEdicao
        ? anoEdicao[0]
        : livro.first_publish_year || ""
    };

  } catch (erro) {
    console.error("Erro ao buscar edição em português:", erro);
    return null;
  }
}

  
/* Consulta alternativa: Google Books */




async function buscarLivrosGoogle(termo) {
  const consultasEspecificas = [
    'intitle:"A Hora do Vampiro" inauthor:"Stephen King"',
    'intitle:"Salem\'s Lot" inauthor:"Stephen King"',
    'intitle:"Carrie" inauthor:"Stephen King"',
    'intitle:"Joyland" inauthor:"Stephen King"',
    'intitle:"O Iluminado" inauthor:"Stephen King"',
    'intitle:"The Shining" inauthor:"Stephen King"',
    'intitle:"A Dança da Morte" inauthor:"Stephen King"',
    'intitle:"The Stand" inauthor:"Stephen King"',
    'intitle:"Misery" inauthor:"Stephen King"',
    'intitle:"Cujo" inauthor:"Stephen King"',
    'intitle:"A Torre Negra" inauthor:"Stephen King"',
    'intitle:"The Dark Tower" inauthor:"Stephen King"'
  ];

  const consultas = [termo, ...consultasEspecificas];
  const livrosEncontrados = new Map();

  for (let indice = 0; indice < consultas.length; indice++) {
    const consulta = consultas[indice];
    const maxPaginas = indice === 0 ? 10 : 1;

    for (let pagina = 0; pagina < maxPaginas; pagina++) {
      const inicio = pagina * 40;

      const url = "/api/books?q=" +
        encodeURIComponent(consulta) +
        "&startIndex=" + inicio;

      const controlador = new AbortController();
      const limite = setTimeout(
        () => controlador.abort(),
        20000
      );

      try {
        const resposta = await fetch(url, {
          signal: controlador.signal
        });

        if (!resposta.ok) {
          throw new Error(
            "Erro ao consultar Google Books: " + resposta.status
          );
        }

        const dados = await resposta.json();
        const itens = dados.items || [];

        for (const item of itens) {
          if (!livrosEncontrados.has(item.id)) {
            livrosEncontrados.set(item.id, item);
          }
        }

        if (
          itens.length < 40 ||
          inicio + itens.length >= (dados.totalItems || 0)
        ) {
          break;
        }

      } finally {
        clearTimeout(limite);
      }
    }
  }

  return Array.from(livrosEncontrados.values())
    .map(item => {
      const info = item.volumeInfo || {};
      const idioma = (info.language || "").toLowerCase();
      const imagem = info.imageLinks?.thumbnail || "";
      const ano = (info.publishedDate || "").match(/\d{4}/)?.[0] || "";

      return {
        obraId: "google:" + item.id,
        title: info.title || "Título não informado",
        author: (info.authors || [nome]).join(", "),
        capa: imagem.replace(/^http:/, "https:"),
        cover_i: null,
        first_publish_year: ano,
        idioma,
        anoOrdenacao: Number(ano) || 0
      };
    })
    .filter(livro =>
      livro.capa &&
      livro.idioma.startsWith("pt")
    )
    .sort((a, b) =>
      b.anoOrdenacao - a.anoOrdenacao ||
      a.title.localeCompare(b.title, "pt-BR")
    );
}





/* Exibe os livros */

async function mostrarLivros(livros) {
  listaLivros.innerHTML = "";

  const livrosComCapa = livros.filter(
    livro => livro.capa || livro.cover_i
  );

  if (!livrosComCapa.length) {
    listaLivros.innerHTML =
      '<p class="mensagem">Nenhuma edição em português com capa foi encontrada.</p>';
    return;
  }

  const livrosSalvos = lerLivrosLocais();

  livrosComCapa.forEach(livro => {
    const card = document.createElement("div");
    card.className = "livro";
    card.dataset.obraId = livro.obraId;

    const capa = document.createElement("img");
    capa.alt = "Capa de " + livro.title;
    capa.loading = "lazy";
    capa.src = livro.capa ||
      "https://covers.openlibrary.org/b/id/" +
      livro.cover_i + "-M.jpg";

    capa.onerror = () => {
  if (livro.cover_i && !capa.dataset.tentouCapaMaior) {
    capa.dataset.tentouCapaMaior = "sim";
    capa.src = "https://covers.openlibrary.org/b/id/" +
      livro.cover_i + "-L.jpg";
    return;
  }

  const alternativa = document.createElement("div");
  alternativa.className = "capa-indisponivel";
  alternativa.textContent = "Capa indisponível";
  card.replaceChild(alternativa, capa);
};

    const titulo = document.createElement("strong");
    titulo.textContent = livro.title;

    const ano = document.createElement("small");
    ano.textContent = livro.first_publish_year || "";

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "botao-adicionar-livro";

    const jaAdicionado = livrosSalvos.some(item =>
      String(item.obraId) === String(livro.obraId)
    );

    if (jaAdicionado) {
      botao.textContent = "Livro adicionado";
      botao.classList.add("livro-ja-adicionado");
      botao.disabled = true;
    } else {
      botao.textContent = "Adicionar à sua lista";
      botao.addEventListener("click", () => abrirModalLivro(livro));
    }

    card.append(capa, titulo, ano, botao);
    listaLivros.appendChild(card);
  });
}

/* Livros do autor */


async function carregarLivrosAutor(autor) {
  listaLivros.innerHTML =
    '<p class="mensagem">Buscando obras em português...</p>';

  const obras = new Map();

  try {
    for (let pagina = 1; pagina <= 10; pagina++) {
      const resposta = await fetch(
        "/api/openlibrary/books?page=" + pagina
      );

      if (!resposta.ok) {
        throw new Error("Erro ao consultar Open Library.");
      }

      const dados = await resposta.json();
      const resultados = dados.docs || [];

      for (const obra of resultados) {
        if (!obra.key || obras.has(obra.key)) continue;

        const edicoes = obra.editions?.docs || [];

        const edicaoPortugues = edicoes.find(edicao =>
          (edicao.language || []).includes("por")
        );

        if (!edicaoPortugues) continue;

        const autores = obra.author_name || [];

        if (!autores.some(nomeAutor =>
          nomeAutor.toLowerCase() === "stephen king"
        )) {
          continue;
        }

        obras.set(obra.key, {
          obra,
          edicaoPortugues
        });
      }

      if (
        resultados.length < 100 ||
        pagina * 100 >= dados.numFound
      ) {
        break;
      }
    }

    const titulosVistos = new Set();

    const livros = Array.from(obras.values())
      .map(({ obra, edicaoPortugues }) => {
        let ano = Number(obra.first_publish_year) || 0;

        // Correção de ano original confirmado
        if (obra.key === "/works/OL81632W") ano = 1975;
        if (obra.key === "/works/OL81616W") ano = 1987;

        return {
          obraId: obra.key,
          title: edicaoPortugues.title || obra.title,
          author: "Stephen King",
          cover_i: edicaoPortugues.cover_i || obra.cover_i,
          capa: "",
          first_publish_year: ano ? String(ano) : "",
          anoOrdenacao: ano
        };
      })
      .filter(livro => {
        const tituloNormalizado = livro.title
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");

        if (!tituloNormalizado || titulosVistos.has(tituloNormalizado)) {
          return false;
        }

        titulosVistos.add(tituloNormalizado);

        return livro.cover_i && livro.anoOrdenacao > 0;
      })
      .sort((a, b) =>
        b.anoOrdenacao - a.anoOrdenacao ||
        a.title.localeCompare(b.title, "pt-BR")
      );

    if (!livros.length) {
      listaLivros.innerHTML =
        '<p class="mensagem">Não encontramos obras em português com capa disponível.</p>';
      return;
    }

    await mostrarLivros(livros);

  } catch (erro) {
    console.error("Erro ao consultar Open Library:", erro);

    listaLivros.innerHTML =
      '<p class="mensagem">Não foi possível carregar as obras. Tente novamente.</p>';
  }
}


/* Perfil do autor */

async function carregarAutor() {
  nomePerfil.textContent = "Stephen Edwin King";

  const nascimento = new Date(1947, 8, 21);
const hoje = new Date();

let idade = hoje.getFullYear() - nascimento.getFullYear();

if (

    hoje.getMonth() === nascimento.getMonth() &&

) {

}

document.getElementById("nascimentoAutor").textContent =

  await Promise.allSettled([

  ]);
}


/* Modal de cadastro */

function abrirModalLivro(livro) {
  livroSelecionado = livro;

  document.getElementById("modalLivroCapa").src =
  livro.capa || "https://covers.openlibrary.org/b/id/" +
  livro.cover_i + "-M.jpg";

  document.getElementById("modalLivroTitulo").textContent = livro.title;
  document.getElementById("modalLivroAutor").textContent = livro.author || nome;
  document.getElementById("modalLivroStatus").value = "Quero ler";
  document.getElementById("modalPaginasTotal").value = "";
  document.getElementById("modalPaginasLidas").value = "0";
  document.getElementById("camposProgressoLivro").style.display = "none";

  document.getElementById("modalAdicionarLivro").style.display = "flex";
}

function fecharModalLivro() {
  document.getElementById("modalAdicionarLivro").style.display = "none";
  livroSelecionado = null;
}

document.getElementById("fecharModalLivro").addEventListener(
  "click",
  fecharModalLivro
);

document.getElementById("modalAdicionarLivro").addEventListener(
  "click",
  event => {
    if (event.target.id === "modalAdicionarLivro") {
      fecharModalLivro();
    }
  }
);

document.getElementById("modalLivroStatus").addEventListener(
  "change",
  event => {
    document.getElementById("camposProgressoLivro").style.display =
      event.target.value === "Lendo" ? "block" : "none";
  }
);

/* Salva na coleção existente */

document.getElementById("confirmarAdicionarLivro").addEventListener(
  "click",
  async () => {
    if (!livroSelecionado) return;

    const botao = document.getElementById("confirmarAdicionarLivro");
    const status = document.getElementById("modalLivroStatus").value;
    const paginasTotal = Number(
      document.getElementById("modalPaginasTotal").value
    );
    const paginasLidas = Number(
      document.getElementById("modalPaginasLidas").value
    );

    if (status === "Lendo" && (
      !Number.isInteger(paginasTotal) ||
      paginasTotal <= 0 ||
      !Number.isInteger(paginasLidas) ||
      paginasLidas < 0 ||
      paginasLidas > paginasTotal
    )) {
      alert("Informe o total de páginas e um progresso válido.");
      return;
    }

    botao.disabled = true;
    botao.textContent = "Salvando...";

    try {
      const cliente = window.mnSupabaseClient;

      if (!cliente) {
        throw new Error("A conexão com o banco de dados não foi encontrada.");
      }

      const { data: sessaoData, error: erroSessao } =
        await cliente.auth.getSession();

      if (erroSessao) throw erroSessao;

      if (!sessaoData.session) {
        throw new Error("Faça login para adicionar livros à sua lista.");
      }

      const obraId = String(livroSelecionado.obraId);
      const livrosLocais = lerLivrosLocais();

      if (livrosLocais.some(item =>
        String(item.obraId) === obraId
      )) {
        throw new Error("Este livro já está na sua lista.");
      }

      const { data: existente, error: erroBusca } = await cliente
        .from("mn_collections")
        .select("id")
        .eq("user_id", sessaoData.session.user.id)
        .eq("universe", "leitura")
        .eq("item_id", obraId)
        .maybeSingle();

      if (erroBusca) throw erroBusca;

      if (existente) {
        throw new Error("Este livro já está na sua coleção.");
      }

      const novoLivro = {
        id: Date.now(),
        obraId,
        titulo: livroSelecionado.title,
        autor: livroSelecionado.author || nome,
        editora: "",
        capa: livroSelecionado.capa ||
        "https://covers.openlibrary.org/b/id/" +
        livroSelecionado.cover_i + "-M.jpg",
        paginasTotal: status === "Lendo" ? paginasTotal : 0,
        paginasLidas: status === "Lendo" ? paginasLidas : 0,
        status,
        avaliacao: 0,
        resenha: ""
      };

      const registro = {
        user_id: sessaoData.session.user.id,
        universe: "leitura",
        item_id: obraId,
        title: novoLivro.titulo,
        author: novoLivro.autor,
        cover: novoLivro.capa,
        status: novoLivro.status,
        data: {
          obraId: novoLivro.obraId,
          localId: novoLivro.id,
          editora: "",
          paginasTotal: novoLivro.paginasTotal,
          paginasLidas: novoLivro.paginasLidas,
          avaliacao: 0,
          resenha: ""
        }
      };

      const { error } = await cliente
        .from("mn_collections")
        .upsert(registro, {
          onConflict: "user_id,universe,item_id"
        });

      if (error) throw error;

      livrosLocais.push(novoLivro);

      localStorage.setItem(
        "mn_livros",
        JSON.stringify(livrosLocais)
      );

      const card = [...document.querySelectorAll(".livro")].find(
        item => item.dataset.obraId === obraId
      );

      if (card) {
        const botaoCard = card.querySelector("button");
        botaoCard.textContent = "Livro adicionado";
        botaoCard.classList.add("livro-ja-adicionado");
        botaoCard.disabled = true;
      }

      fecharModalLivro();
      alert("Livro adicionado à sua lista!");

    } catch (erro) {
      console.error("Erro ao adicionar livro:", erro);
      alert(erro.message || "Não foi possível salvar o livro.");
    } finally {
      botao.disabled = false;
      botao.textContent = "Salvar na minha lista";
    }
  }
);
