
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes literários</title>

  <style>
    
:root {
  --fundo: #F7F4ED;
  --texto: #343746;
  --muted: #737585;
  --roxo: #5267D8;
  --roxo-claro: #E9DFF7;
  --borda: #E8E1D5;
  --branco: #FFFFFF;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px;
  background: var(--branco);
  border-bottom: 1px solid var(--borda);
}

header button {
  border: 0;
  background: var(--roxo-claro);
  color: var(--texto);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
}

header strong {
  font-size: 18px;
}

main {
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 16px 40px;
}

.perfil {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px;
  background: var(--branco);
  border: 1px solid var(--borda);
  border-radius: 16px;
}

.foto {
  width: 125px;
  height: 150px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 12px;
  background: transparent;
}

.perfil h1 {
  margin: 0 0 8px;
  font-size: 24px;
}

.tipo {
  color: var(--muted);
  font-size: 13px;
}

section {
  margin-top: 22px;
  padding: 22px;
  background: var(--branco);
  border: 1px solid var(--borda);
  border-radius: 16px;
}

section h2 {
  margin: 0 0 18px;
  font-size: 19px;
}

#biografia {
  line-height: 1.7;
  color: var(--muted);
  white-space: pre-line;
}

/* Grade e cartões dos livros */

.livros {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px 14px;
  align-items: stretch;
}

.livro {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.livro img {
  display: block;
  width: 100%;
  height: 165px;
  object-fit: contain;
  background: transparent;
  border: none;
  border-radius: 0;
  margin-bottom: 10px;
}

.livro strong {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  margin: 0;
  font-size: 13px;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}

.livro small {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 20px;
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

/* Botão compacto */

.botao-adicionar-livro {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  max-width: 100%;
  min-height: 34px;
  margin: auto auto 0;
  padding: 8px 10px;
  background: #D9F0DF;
  color: #287A43;
  border: none;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

.botao-adicionar-livro.livro-ja-adicionado {
  background: #236B3A;
  color: #FFFFFF;
  cursor: default;
}

.mensagem {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

/* Modal */

.modal-livro {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(52, 55, 70, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-livro-conteudo {
  position: relative;
  width: 100%;
  max-width: 390px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  background: var(--branco);
  border-radius: 16px;
  text-align: center;
  color: var(--texto);
}

.modal-livro-conteudo > img {
  width: 100px;
  height: 145px;
  object-fit: contain;
  background: transparent;
  border-radius: 7px;
}

.fechar-modal-livro {
  position: absolute;
  top: 8px;
  right: 12px;
  border: none;
  background: none;
  font-size: 28px;
  color: var(--muted);
  cursor: pointer;
}

.modal-livro-conteudo label {
  display: block;
  margin: 14px 0 6px;
  font-weight: 600;
  text-align: left;
}

.modal-livro-conteudo select,
.modal-livro-conteudo input {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--borda);
  border-radius: 9px;
  background: var(--fundo);
  color: var(--texto);
}

#confirmarAdicionarLivro {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: var(--roxo);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

#confirmarAdicionarLivro:disabled {
  opacity: 0.6;
  cursor: wait;
}

@media (max-width: 480px) {
  .perfil {
    gap: 14px;
    padding: 16px;
  }

  .foto {
    width: 100px;
    height: 125px;
  }

  .perfil h1 {
    font-size: 19px;
  }

  section {
    padding: 17px 12px;
  }

  .livros {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px 8px;
  }

  .livro img {
    height: 125px;
  }

  .livro strong {
    min-height: 54px;
    font-size: 11px;
  }

  .livro small {
    font-size: 10px;
  }

  .botao-adicionar-livro {
    padding: 7px 5px;
    font-size: 10px;
  }
}

  </style>
</head>

<body>

  <header>
    <button onclick="voltar()">← Voltar</button>
    <strong>Detalhes literários</strong>
  </header>

  <main>
    <div class="perfil">
      <img id="fotoPerfil" class="foto" alt="">

      <div>
        <div id="tipoPerfil" class="tipo"></div>
        <h1 id="nomePerfil">Carregando...</h1>
      </div>
    </div>

    <section id="secaoBiografia">
      <h2>Biografia</h2>
      <div id="biografia" class="mensagem">
        Buscando informações...
      </div>
    </section>

    <section>
      <h2 id="tituloLivros">Obras publicadas</h2>
      <div id="listaLivros" class="livros">
        <p class="mensagem">Carregando livros...</p>
      </div>
    </section>
    
<div id="modalAdicionarLivro" class="modal-livro" style="display:none;">
  <div class="modal-livro-conteudo">
    <button type="button" id="fecharModalLivro" class="fechar-modal-livro">×</button>

    <img id="modalLivroCapa" src="" alt="Capa do livro">

    <h2 id="modalLivroTitulo"></h2>
    <p id="modalLivroAutor"></p>

    <label for="modalLivroStatus">Status de leitura</label>
    <select id="modalLivroStatus">
      <option value="Quero ler">Quero ler</option>
      <option value="Lendo">Estou lendo</option>
      <option value="Lido">Já li</option>
      <option value="Quero adquirir">Quero adquirir</option>
    </select>

    <div id="camposProgressoLivro" style="display:none;">
      <label for="modalPaginasTotal">Total de páginas</label>
      <input type="number" id="modalPaginasTotal" min="1" placeholder="Ex.: 300">

      <label for="modalPaginasLidas">Páginas lidas</label>
      <input type="number" id="modalPaginasLidas" min="0" value="0">
    </div>

    <button type="button" id="confirmarAdicionarLivro">
      Salvar na minha lista
    </button>
  </div>
</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>
    
const parametros = new URLSearchParams(window.location.search);
const tipo = parametros.get("tipo");
const nome = parametros.get("nome");

const fotoPerfil = document.getElementById("fotoPerfil");
const nomePerfil = document.getElementById("nomePerfil");
const tipoPerfil = document.getElementById("tipoPerfil");
const biografia = document.getElementById("biografia");
const listaLivros = document.getElementById("listaLivros");

let livroSelecionado = null;

function voltar() {
  if (
    document.referrer &&
    new URL(document.referrer).origin === location.origin
  ) {
    history.back();
  } else {
    location.href = "colecoes.html";
  }
}

function lerLivrosLocais() {
  try {
    return JSON.parse(localStorage.getItem("mn_livros") || "[]");
  } catch {
    return [];
  }
}

function obterFavorito() {
  const chave = tipo === "autor"
    ? "mn_autores_favoritos"
    : "mn_editoras_favoritas";

  try {
    const favoritos = JSON.parse(localStorage.getItem(chave) || "[]");

    return favoritos.find(
      item => item.nome?.toLowerCase() === nome?.toLowerCase()
    );
  } catch {
    return null;
  }
}

function configurarPerfil() {
  if (!nome || !["autor", "editora"].includes(tipo)) {
    nomePerfil.textContent = "Informação indisponível";
    biografia.textContent = "Não foi possível identificar este perfil.";
    return false;
  }

  const favorito = obterFavorito();

  nomePerfil.textContent = nome;
  tipoPerfil.textContent = tipo === "autor" ? "AUTOR" : "EDITORA";

  if (favorito?.imagem) {
    fotoPerfil.src = favorito.imagem;
  }

  fotoPerfil.onerror = () => {
    fotoPerfil.style.display = "none";
  };

  return true;
}

/* Procura uma edição em português para cada obra */

async function buscarEdicaoPortugues(livro) {
  if (!livro.key) return null;

  try {
    const chaveObra = livro.key.startsWith("/works/")
      ? livro.key
      : "/works/" + livro.key;

    const resposta = await fetch(
      "https://openlibrary.org" + chaveObra + "/editions.json?limit=100"
    );

    if (!resposta.ok) return null;

    const dados = await resposta.json();

    const edicoes = (dados.entries || []).filter(edicao => {
      const idiomas = (edicao.languages || []).map(item =>
        (item.key || "").toLowerCase()
      );

      return idiomas.some(idioma =>
        idioma.endsWith("/por") ||
        idioma.endsWith("/pt") ||
        idioma.endsWith("/pt-br")
      );
    });

    if (!edicoes.length) return null;

    const edicao = edicoes.find(item =>
      item.title && item.covers?.length
    ) || edicoes.find(item => item.title);

    if (!edicao) return null;

    const capa = edicao.covers?.[0] || livro.cover_i;

    if (!capa) return null;

    const anoEdicao = (edicao.publish_date || "").match(/\d{4}/);

    return {
      obraId: chaveObra,
      title: edicao.title,
      author: livro.author_name?.[0] || nome,
      cover_i: capa,
      capa: "https://covers.openlibrary.org/b/id/" + capa + "-M.jpg",
      first_publish_year: anoEdicao
        ? anoEdicao[0]
        : livro.first_publish_year || ""
    };

  } catch (erro) {
    console.error("Erro ao buscar edição em português:", erro);
    return null;
  }
}

  
/* Consulta alternativa: Google Books */


async function buscarLivrosGoogle(termo) {
  const todosLivros = [];
  const quantidadePorPagina = 40;
  const maxPaginas = 10;

  for (let pagina = 0; pagina < maxPaginas; pagina++) {
    const inicio = pagina * quantidadePorPagina;

    const url = "/api/books?q=" +
      encodeURIComponent(termo) +
      "&startIndex=" + inicio;

    const resposta = await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro ao consultar Google Books: " + resposta.status);
    }

    const dados = await resposta.json();
    const itens = dados.items || [];

    todosLivros.push(...itens);

    if (
      itens.length < quantidadePorPagina ||
      todosLivros.length >= (dados.totalItems || 0)
    ) {
      break;
    }
  }

  return todosLivros.map(item => {
    const info = item.volumeInfo || {};
    const idioma = (info.language || "").toLowerCase();
    const imagem = info.imageLinks?.thumbnail || "";

    return {
      obraId: "google:" + item.id,
      title: info.title || "Título não informado",
      author: (info.authors || [nome]).join(", "),
      capa: imagem.replace(/^http:/, "https:"),
      cover_i: null,
      first_publish_year:
        (info.publishedDate || "").match(/\d{4}/)?.[0] || "",
      idioma
    };
  }).filter(livro =>
    livro.capa &&
    livro.idioma.startsWith("pt")
  );
}



/* Exibe os livros */

async function mostrarLivros(livros) {
  listaLivros.innerHTML = "";

  const livrosComCapa = livros.filter(
    livro => livro.capa || livro.cover_i
  );

  if (!livrosComCapa.length) {
    listaLivros.innerHTML =
      '<p class="mensagem">Nenhuma edição em português com capa foi encontrada.</p>';
    return;
  }

  const livrosSalvos = lerLivrosLocais();

  livrosComCapa.forEach(livro => {
    const card = document.createElement("div");
    card.className = "livro";
    card.dataset.obraId = livro.obraId;

    const capa = document.createElement("img");
    capa.alt = "Capa de " + livro.title;
    capa.loading = "lazy";
    capa.src = livro.capa ||
      "https://covers.openlibrary.org/b/id/" +
      livro.cover_i + "-M.jpg";

    capa.onerror = () => card.remove();

    const titulo = document.createElement("strong");
    titulo.textContent = livro.title;

    const ano = document.createElement("small");
    ano.textContent = livro.first_publish_year || "";

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "botao-adicionar-livro";

    const jaAdicionado = livrosSalvos.some(item =>
      String(item.obraId) === String(livro.obraId)
    );

    if (jaAdicionado) {
      botao.textContent = "Livro adicionado";
      botao.classList.add("livro-ja-adicionado");
      botao.disabled = true;
    } else {
      botao.textContent = "Adicionar à sua lista";
      botao.addEventListener("click", () => abrirModalLivro(livro));
    }

    card.append(capa, titulo, ano, botao);
    listaLivros.appendChild(card);
  });
}


/* Biografia do autor */

async function carregarBiografiaAutor(autor) {
  biografia.textContent = "Buscando biografia em português...";

  try {
    const nomeBusca = (autor.name || nome).replace(/ /g, "_");

    const resposta = await fetch(
      "https://pt.wikipedia.org/api/rest_v1/page/summary/" +
      encodeURIComponent(nomeBusca)
    );

    if (!resposta.ok) throw new Error("Biografia não encontrada");

    const dados = await resposta.json();

    if (dados.type !== "standard" || !dados.extract) {
      throw new Error("Página indisponível");
    }

    biografia.textContent = dados.extract;

  } catch {
    biografia.textContent =
      "Ainda não encontramos uma biografia em português para este autor.";
  }
}


/* Livros do autor */

async function carregarLivrosAutor(autor) {
  listaLivros.innerHTML =
    '<p class="mensagem">Buscando livros em português...</p>';

  try {
    const livrosGoogle = await buscarLivrosGoogle(
      "inauthor:" + (autor.name || nome)
    );

    if (!livrosGoogle.length) {
      listaLivros.innerHTML =
        '<p class="mensagem">Não encontramos livros em português para este autor.</p>';
      return;
    }

    await mostrarLivros(livrosGoogle);

  } catch (erro) {
    console.error("Erro ao consultar Google Books:", erro);

    listaLivros.innerHTML =
      '<p class="mensagem">Não foi possível carregar os livros. Tente novamente mais tarde.</p>';
  }
}


/* Perfil do autor */

async function carregarAutor() {
  nomePerfil.textContent = nome;

  await Promise.allSettled([
    carregarBiografiaAutor({ name: nome }),
    carregarLivrosAutor({ name: nome })
  ]);
}


/* Modal de cadastro */

function abrirModalLivro(livro) {
  livroSelecionado = livro;

  document.getElementById("modalLivroCapa").src =
  livro.capa || "https://covers.openlibrary.org/b/id/" +
  livro.cover_i + "-M.jpg";

  document.getElementById("modalLivroTitulo").textContent = livro.title;
  document.getElementById("modalLivroAutor").textContent = livro.author || nome;
  document.getElementById("modalLivroStatus").value = "Quero ler";
  document.getElementById("modalPaginasTotal").value = "";
  document.getElementById("modalPaginasLidas").value = "0";
  document.getElementById("camposProgressoLivro").style.display = "none";

  document.getElementById("modalAdicionarLivro").style.display = "flex";
}

function fecharModalLivro() {
  document.getElementById("modalAdicionarLivro").style.display = "none";
  livroSelecionado = null;
}

document.getElementById("fecharModalLivro").addEventListener(
  "click",
  fecharModalLivro
);

document.getElementById("modalAdicionarLivro").addEventListener(
  "click",
  event => {
    if (event.target.id === "modalAdicionarLivro") {
      fecharModalLivro();
    }
  }
);

document.getElementById("modalLivroStatus").addEventListener(
  "change",
  event => {
    document.getElementById("camposProgressoLivro").style.display =
      event.target.value === "Lendo" ? "block" : "none";
  }
);

/* Salva na coleção existente */

document.getElementById("confirmarAdicionarLivro").addEventListener(
  "click",
  async () => {
    if (!livroSelecionado) return;

    const botao = document.getElementById("confirmarAdicionarLivro");
    const status = document.getElementById("modalLivroStatus").value;
    const paginasTotal = Number(
      document.getElementById("modalPaginasTotal").value
    );
    const paginasLidas = Number(
      document.getElementById("modalPaginasLidas").value
    );

    if (status === "Lendo" && (
      !Number.isInteger(paginasTotal) ||
      paginasTotal <= 0 ||
      !Number.isInteger(paginasLidas) ||
      paginasLidas < 0 ||
      paginasLidas > paginasTotal
    )) {
      alert("Informe o total de páginas e um progresso válido.");
      return;
    }

    botao.disabled = true;
    botao.textContent = "Salvando...";

    try {
      const cliente = window.mnSupabaseClient;

      if (!cliente) {
        throw new Error("A conexão com o banco de dados não foi encontrada.");
      }

      const { data: sessaoData, error: erroSessao } =
        await cliente.auth.getSession();

      if (erroSessao) throw erroSessao;

      if (!sessaoData.session) {
        throw new Error("Faça login para adicionar livros à sua lista.");
      }

      const obraId = String(livroSelecionado.obraId);
      const livrosLocais = lerLivrosLocais();

      if (livrosLocais.some(item =>
        String(item.obraId) === obraId
      )) {
        throw new Error("Este livro já está na sua lista.");
      }

      const { data: existente, error: erroBusca } = await cliente
        .from("mn_collections")
        .select("id")
        .eq("user_id", sessaoData.session.user.id)
        .eq("universe", "leitura")
        .eq("item_id", obraId)
        .maybeSingle();

      if (erroBusca) throw erroBusca;

      if (existente) {
        throw new Error("Este livro já está na sua coleção.");
      }

      const novoLivro = {
        id: Date.now(),
        obraId,
        titulo: livroSelecionado.title,
        autor: livroSelecionado.author || nome,
        editora: "",
        capa: livroSelecionado.capa ||
        "https://covers.openlibrary.org/b/id/" +
        livroSelecionado.cover_i + "-M.jpg",
        paginasTotal: status === "Lendo" ? paginasTotal : 0,
        paginasLidas: status === "Lendo" ? paginasLidas : 0,
        status,
        avaliacao: 0,
        resenha: ""
      };

      const registro = {
        user_id: sessaoData.session.user.id,
        universe: "leitura",
        item_id: obraId,
        title: novoLivro.titulo,
        author: novoLivro.autor,
        cover: novoLivro.capa,
        status: novoLivro.status,
        data: {
          obraId: novoLivro.obraId,
          localId: novoLivro.id,
          editora: "",
          paginasTotal: novoLivro.paginasTotal,
          paginasLidas: novoLivro.paginasLidas,
          avaliacao: 0,
          resenha: ""
        }
      };

      const { error } = await cliente
        .from("mn_collections")
        .upsert(registro, {
          onConflict: "user_id,universe,item_id"
        });

      if (error) throw error;

      livrosLocais.push(novoLivro);

      localStorage.setItem(
        "mn_livros",
        JSON.stringify(livrosLocais)
      );

      const card = [...document.querySelectorAll(".livro")].find(
        item => item.dataset.obraId === obraId
      );

      if (card) {
        const botaoCard = card.querySelector("button");
        botaoCard.textContent = "Livro adicionado";
        botaoCard.classList.add("livro-ja-adicionado");
        botaoCard.disabled = true;
      }

      fecharModalLivro();
      alert("Livro adicionado à sua lista!");

    } catch (erro) {
      console.error("Erro ao adicionar livro:", erro);
      alert(erro.message || "Não foi possível salvar o livro.");
    } finally {
      botao.disabled = false;
      botao.textContent = "Salvar na minha lista";
    }
  }
);

/* Inicialização */

if (configurarPerfil()) {
  if (tipo === "autor") {
    carregarAutor();
  } else {
    carregarEditora();

    document.getElementById("secaoBiografia").style.display = "none";
    document.getElementById("tituloLivros").textContent =
      "Edições em português publicadas pela editora";
  }
}

  </script>

</body>
</html>
